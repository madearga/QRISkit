name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bun:
    name: Bun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun test
      - run: bun run build

  node:
    name: Node (build + import smoke)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run build
      - name: Import smoke (ESM + CJS)
        run: |
          node --input-type=module -e "import('qriskit').then(m => { const d = m.convertQRIS(process.env.Q, { amount: 50000 }); if (!m.validateQRIS(d).valid) process.exit(1); })"

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
